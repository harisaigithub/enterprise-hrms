events {}

http {

    resolver 127.0.0.11 valid=30s;

    # Global upstream timeout policy
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    # =========================================================
    # UPSTREAM SERVICES
    # =========================================================

    upstream auth_service {
        server auth-service:4000;
    }

    upstream organization_service {
        server organization-service:4000;
    }

    upstream employees_service {
        server employees-service:4000;
    }

    upstream recruitment_service {
        server recruitment-service:4000;
    }

    upstream attendance_service {
        server attendance-service:4000;
    }

    upstream leave_service {
        server leave-service:4000;
    }

    upstream payroll_service {
        server payroll-service:4000;
    }

    upstream search_service {
        server search-service:4000;
    }

    upstream workflow_service {
        server workflow-service:4000;
    }

    upstream performance_service {
        server performance-service:4000;
    }

    upstream helpdesk_service {
        server helpdesk-service:4000;
    }

    upstream onboarding_service {
        server onboarding-service:4000;
    }

    upstream lms_service {
        server lms-service:4000;
    }

    upstream task_service {
        server task-service:4000;
    }

