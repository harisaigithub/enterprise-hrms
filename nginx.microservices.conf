events {
    worker_connections 1024;
}

http {
    upstream auth {
        server auth-service:4000;
    }

    upstream employees {
        server employees-service:4000;
    }

    server {
        listen 80;

        location /api/auth {
            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/employees {
            proxy_pass http://employees;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Catch-all fallback if we want to add other services later
        # location /api/ {
        #     proxy_pass http://other-service;
        # }
    }
}
