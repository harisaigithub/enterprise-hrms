events {}

http {

    resolver 127.0.0.11 valid=30s;

    upstream auth_service {
        server auth-service:4000;
    }

    upstream organization_service {
        server organization-service:4000;
    }

    upstream employees_service {
        server employees-service:4000;
    }

    upstream recruitment_service {
        server recruitment-service:4000;
    }

    upstream attendance_service {
        server attendance-service:4000;
    }

    upstream leave_service {
        server leave-service:4000;
    }

    upstream payroll_service {
        server payroll-service:4000;
    }

    upstream search_service {
        server search-service:4000;
    }

    upstream workflow_service {
        server workflow-service:4000;
    }

    upstream performance_service {
        server performance-service:4000;
    }

    upstream helpdesk_service {
        server helpdesk-service:4000;
    }

    upstream onboarding_service {
        server onboarding-service:4000;
    }

    upstream lms_service {
        server lms-service:4000;
    }

    upstream task_service {
        server task-service:4000;
    }

    upstream asset_service {
        server asset-service:4000;
    }

    upstream separation_service {
        server separation-service:4000;
    }

    upstream policies_service {
        server policies-service:4000;
    }

    upstream compliance_service {
        server compliance-service:4000;
    }

    upstream reports_service {
        server reports-service:4000;
    }

    upstream dashboard_service {
        server dashboard-service:4000;
    }

    upstream notifications_service {
        server notifications-service:4000;
    }

    upstream requests_service {
        server requests-service:4000;
    }

    upstream expense_service {
        server expense-service:4000;
    }

    upstream travel_service {
        server travel-service:4000;
    }


    server {

        listen 80;

        # ---------------- AUTH ----------------

        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ---------------- ORGANIZATION ----------------

        location /api/organization/ {
            proxy_pass http://organization_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- EMPLOYEES ----------------

        location /api/employees/ {
            proxy_pass http://employees_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- RECRUITMENT ----------------

        location /api/recruitment/ {
            proxy_pass http://recruitment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/candidate-lifecycle/ {
            proxy_pass http://recruitment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- ATTENDANCE ----------------

        location /api/attendance/ {
            proxy_pass http://attendance_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- LEAVE ----------------

        location /api/leave/ {
            proxy_pass http://leave_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- PAYROLL ----------------

        location /api/payroll/ {
            proxy_pass http://payroll_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- SEARCH ----------------

        location /api/search/ {
            proxy_pass http://search_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- WORKFLOW ----------------

        location /api/workflow/ {
            proxy_pass http://workflow_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- PERFORMANCE ----------------

        location /api/performance/ {
            proxy_pass http://performance_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- HELPDESK ----------------

        location /api/helpdesk/ {
            proxy_pass http://helpdesk_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- ONBOARDING ----------------

        location /api/onboarding/ {
            proxy_pass http://onboarding_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- LMS ----------------

        location /api/lms/ {
            proxy_pass http://lms_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- TASK ----------------

        location /api/tasks/ {
            proxy_pass http://task_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- ASSET ----------------

        location /api/assets/ {
            proxy_pass http://asset_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- SEPARATION ----------------

        location /api/separations/ {
            proxy_pass http://separation_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- POLICIES ----------------

        location /api/policies/ {
            proxy_pass http://policies_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- COMPLIANCE ----------------

        location /api/compliance/ {
            proxy_pass http://compliance_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- REPORTS ----------------

        location /api/reports/ {
            proxy_pass http://reports_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- DASHBOARD ----------------

        location /api/dashboard/ {
            proxy_pass http://dashboard_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- NOTIFICATIONS ----------------

        location /api/notifications/ {
            proxy_pass http://notifications_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- REQUESTS ----------------

        location /api/requests/ {
            proxy_pass http://requests_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- EXPENSE ----------------

        location /api/expense/ {
            proxy_pass http://expense_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


        # ---------------- TRAVEL ----------------

        location = /api/travel {
            proxy_pass http://travel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/travel/ {
            proxy_pass http://travel_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}