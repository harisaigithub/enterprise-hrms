services:

  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - "5433:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO Object Storage (optional - disabled for now due to Docker Hub auth issues)
  # minio:
  #   image: ghcr.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
  #   container_name: hrms-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: hrmsadmin
  #     MINIO_ROOT_PASSWORD: hrmsminio123
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - hrms_minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"
      NODE_ENV: production
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "hrmsadmin"
      MINIO_SECRET_KEY: "hrmsminio123"
      MINIO_BUCKET: "hrms-uploads"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations are safe and idempotent. Seeding is intentionally excluded:
    # prisma/seed.ts resets business data and must only be run explicitly.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Frontend (Vite build -> Nginx on port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hrms_pgdata:
  # hrms_minio_data: