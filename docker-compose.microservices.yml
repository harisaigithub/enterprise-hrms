version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hrms-postgres-micro
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - "5433:5432"
    volumes:
      - hrms_pgdata_micro:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-auth-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"
      SERVICE_NAME: "auth"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run prisma:seed && node dist/index.js"

  employees-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-employees-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"
      SERVICE_NAME: "employees"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node dist/index.js"

  # Expand this pattern for other domains: attendance-service, payroll-service, etc.

  api-gateway:
    image: nginx:alpine
    container_name: hrms-api-gateway
    ports:
      - "4000:80"
    volumes:
      - ./nginx.microservices.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - employees-service

volumes:
  hrms_pgdata_micro:
