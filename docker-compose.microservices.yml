    command: node dist/index.js

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


# =========================================================
# TRAVEL SERVICE
# =========================================================

  travel-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-travel-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"
      SERVICE_NAME: "travel"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================
  # EMPLOYEE SELF SERVICE
  # =========================================================
  ess-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms-ess-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"
      SERVICE_NAME: "ess"
    depends_on:
      db:
        condition: service_healthy
    command: node dist/index.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # =========================================================
  # PROMETHEUS
  # =========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: hrms-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - hrms_prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"


  # =========================================================
  # GRAFANA
  # =========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: hrms-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    volumes:
      - hrms_grafana_data:/var/lib/grafana

      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

  
  # =========================================================
  # LOKI
  # =========================================================

  loki:
    image: grafana/loki:latest
    container_name: hrms-loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - hrms_loki_data:/loki

    command:
      - "-config.file=/etc/loki/config.yml"

  
    # =========================================================
  # PROMTAIL
  # =========================================================

  promtail:
    image: grafana/promtail:latest
    container_name: hrms-promtail
    restart: unless-stopped

    volumes:
      - ./monitoring/loki/promtail/promtail-config.yml:/etc/promtail/config.yml:ro

      - /var/run/docker.sock:/var/run/docker.sock:ro

      - hrms_promtail_data:/tmp

    command:
      - "-config.file=/etc/promtail/config.yml"

    depends_on:
      - loki

  # =========================================================
  # JEAGER OTLP
  # =========================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hrms-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"

  # =========================================================
  # API GATEWAY
  # =========================================================

  api-gateway:
    image: nginx:alpine
    container_name: hrms-api-gateway
    restart: unless-stopped

    ports:
      - "4000:80"

    volumes:
      - ./nginx.microservices.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - auth-service
      - security-service
      - organization-service
      - employees-service
      - travel-service
      - ess-service
      - recruitment-service
      - attendance-service
      - leave-service
      - payroll-service
      - search-service
      - workflow-service
      - performance-service
      - helpdesk-service
      - onboarding-service
      - lms-service
      - task-service
      - asset-service
      - separation-service
      - policies-service
      - compliance-service
      - reports-service
      - dashboard-service
      - notifications-service
      - requests-service
      - expense-service

  # =========================================================
  # FRONTEND
  # =========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: hrms-frontend-micro
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  hrms_pgdata_micro:
  hrms_minio_micro:
  hrms_prometheus_data:
  hrms_grafana_data:
  hrms_loki_data:
  hrms_promtail_data:
