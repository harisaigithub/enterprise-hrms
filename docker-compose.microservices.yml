version: "3.9"

services:

  # =========================================================
  # DATABASE
  # =========================================================

  db:
    image: postgres:16-alpine
    container_name: hrms-postgres-micro
    restart: unless-stopped

    environment:
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db

    ports:
      - "5433:5432"

    volumes:
      - hrms_pgdata_micro:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================================
  # MINIO
  # =========================================================

  minio:
    image: minio/minio:latest
    container_name: hrms-minio-micro
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - hrms_minio_micro:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # =========================================================
  # AUTH SERVICE
  # =========================================================

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hrms-auth-service
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production

      DATABASE_URL: "postgresql://hrms_admin:hrms_password@db:5432/hrms_db?schema=public"

      SERVICE_NAME: "auth"

      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"

      CORS_ORIGINS: "http://localhost:5173"

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    command: >
      sh -c "
      npx prisma migrate deploy &&
      node dist/index.js
      "


