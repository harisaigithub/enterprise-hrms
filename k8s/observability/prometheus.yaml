apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hrms
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: hrms-services
        metrics_path: /api/metrics
        static_configs:
          - targets:
              - auth-service:4000
              - security-service:4000
              - organization-service:4000
              - employees-service:4000
              - recruitment-service:4000
              - attendance-service:4000
              - leave-service:4000
              - payroll-service:4000
              - search-service:4000
              - workflow-service:4000
              - performance-service:4000
              - helpdesk-service:4000
              - onboarding-service:4000
              - lms-service:4000
              - task-service:4000
              - asset-service:4000
              - separation-service:4000
              - policies-service:4000
              - compliance-service:4000
              - reports-service:4000
              - dashboard-service:4000
              - notifications-service:4000
              - requests-service:4000
              - expense-service:4000
              - travel-service:4000
              - ess-service:4000
  alerts.yml: |
    groups:
      - name: hrms
        rules:
          - alert: HRMSServiceDown
            expr: up{job="hrms-services"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: HRMS service is down
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: hrms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: hrms
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
