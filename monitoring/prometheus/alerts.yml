groups:
  - name: hrms-service-alerts
    interval: 15s

    rules:

      # Service/container is not responding
      - alert: HRMSServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HRMS service is down"
          description: "Prometheus cannot scrape {{ $labels.job }}."

      # Too many 5xx responses
      - alert: HRMSHigh5xxRate
        expr: |
          (
            sum(rate(hrms_http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(hrms_http_requests_total[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HRMS requests are returning 5xx responses."

      # High p95 latency
      - alert: HRMSHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (
              rate(hrms_http_request_duration_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HRMS API latency"
          description: "p95 latency is above 2 seconds for {{ $labels.service }}."

      # Any 5xx traffic
      - alert: HRMS5xxErrorsDetected
        expr: |
          sum(rate(hrms_http_errors_total{status_code=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HRMS 5xx errors detected"
          description: "One or more HRMS services are returning 5xx responses."