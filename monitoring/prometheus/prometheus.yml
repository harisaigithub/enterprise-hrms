global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # =========================================================
  # AUTH
  # =========================================================
  - job_name: "auth"
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - auth-service:4000

  # =========================================================
  # SECURITY
  # =========================================================
  - job_name: "security"
    metrics_path: /api/metrics
    static_configs:
      - targets:
